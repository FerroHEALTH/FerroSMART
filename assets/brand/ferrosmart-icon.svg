<!-- The FerroSMART mark: a shield with a keyhole. The server is the gate that decides
     whether a token may do what it asks; the keyhole is the light value so
     the gate reads as one at favicon sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="FerroSMART icon">
  <title>FerroSMART</title>
  <path d="M32 6 L52 13 V30 C52 44 43 53 32 58 C21 53 12 44 12 30 V13 Z" fill="none" stroke="#78350F" stroke-width="4.6" stroke-linejoin="round"/>
  <circle cx="32" cy="28" r="5.5" fill="#FBBF24"/>
  <path d="M32 32 V42" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
</svg>
