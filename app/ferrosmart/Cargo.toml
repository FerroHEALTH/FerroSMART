[package]
name = "ferrosmart"
description = "FerroSMART, the SMART App Launch 2.x authorization server of the FerroHEALTH products, with any OpenID Connect provider upstream for login"
# Its own version line, released as an OCI image and release artefacts by
# the tag ferrosmart-v<version> (#519).
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The server ships as an image and release artefacts, never on crates.io.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrosmart"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["tokio", "http1", "json"] }
# The audit outbox the ihe-atna forwarder delivers from.
async-trait.workspace = true
clap.workspace = true
# The configuration loader, the duration type and the `_file` secrets the
# family shares.
ferrohealth-config.workspace = true
# The BALP AuditEvent of each login and each token, stored in a spool and
# sent over the ITI-20 ATX: FHIR Feed (docs/architecture.md 13.2).
ihe-atna = { workspace = true, features = ["balp", "feed"] }
# The access record of Regulation (EU) 2025/327 Annex II 3.2 the patient
# picker writes for each search and read (#516).
ehds-logging = { workspace = true, features = ["balp"] }
ferrohealth-health = { workspace = true, features = ["registry"] }
ferrohealth-secret.workspace = true
# The run path, the subcommands, the stack, the health routes and the drain.
ferrohealth-server.workspace = true
# The signing key ring with its rotation and JWK Set, the SMART discovery
# document builder the resource servers use too (13.7), and the guard of
# the admin API (13.8).
ferrohealth-smart = { workspace = true, features = ["axum", "fetch", "oidc", "server-tls", "xml"] }
# The upstream SAML 2.0 login (docs/architecture.md 13.24): the XML tree the
# shared reader parses, the certificates of the keys, the redirect DEFLATE.
roxmltree.workspace = true
x509-parser.workspace = true
flate2.workspace = true
ferrohealth-telemetry.workspace = true
http.workspace = true
# The consent page, the picker and the error pages, drawn on the server with
# FerroUI, pinned exactly as a product pins it (docs/architecture.md 13.15),
# with its asset router.
ferrohealth-ui = { version = "=0.6.11", default-features = false, features = ["axum"] }
fluent-templates.workspace = true
# The signing key ring every request reads while the rotation swaps it.
arc-swap.workspace = true
# The random token ids and their base64url form.
aws-lc-rs.workspace = true
base64.workspace = true
# The clock of every token's iat and exp.
jiff.workspace = true
# The fetch of a client's JWK Set from its registered URL.
reqwest.workspace = true
# The algorithm the signing keys are read for.
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
# The store: the client registry and every piece of state (13.9).
sqlx.workspace = true
# The Argon2id hash `client hash-secret` makes of a symmetric client's secret.
argon2.workspace = true
secrecy.workspace = true
thiserror.workspace = true
# The upstream presets, data files compiled in (presets/).
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
# The per-case database of the store cases.
sqlx.workspace = true
url.workspace = true
secrecy.workspace = true
tower = { workspace = true, features = ["util"] }
# The stub server of a client's JWK Set URL.
wiremock.workspace = true
# The certificate of the key a case authenticates upstream with.
rcgen.workspace = true
# The artifact resolution service of the SAML cases, a rustls server that
# requires the client certificate FerroSMART presents (#688).
rustls.workspace = true
tokio-rustls.workspace = true
# The screenshot capture behind FERROSMART_SCREENSHOTS (#623).
thirtyfour.workspace = true
rustix.workspace = true
# The chromedriver process and its output.
tokio = { workspace = true, features = ["process", "io-util"] }
# The Brands Bundle held to the SMART App Launch 2.2.0 profiles (#602).
ferrobridge-validator.workspace = true
fhir-types.workspace = true
# Each admin answer held to its schema in the OpenAPI document (#824).
jsonschema.workspace = true

[lints]
workspace = true
