# FerroSMART with Okta as its upstream OpenID Connect provider, for login
# only (#525, docs/architecture.md §13.19): Okta authenticates the person,
# FerroSMART issues the SMART tokens. The Okta domain and client id are
# placeholders for the org's and the app integration's values. The contract
# tests of tests/it/upstream_vendors.rs run this file against a stub of Okta.

[ferrosmart]
issuer = "https://smart.example.org"
# A workforce login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[[ferrosmart.resource]]
base = "https://ehr.example.org/fhir"
kind = "fhir"

# The provider: the org's `default` custom authorization server, the one kind
# that takes the custom `fhir_user` claim (Okta, Customize tokens returned
# from Okta, Add a custom claim to a token). Its RFC 8414 metadata is at
# /.well-known/oauth-authorization-server/oauth2/default (Okta, Authorization
# servers, Discovery endpoints). FerroSMART is the Web Application
# integration's client. The `okta` preset (app/ferrosmart/presets/okta.toml)
# brings the scopes `openid profile`, the custom claim `fhir_user` and the
# groups claim `groups`, both in the ID Token always, and the assertion
# algorithm RS256; a key set below wins over it. `ferrosmart upstream
# registration okta` prints what the integration needs.
[[ferrosmart.upstream]]
name = "okta"
preset = "okta"

[ferrosmart.upstream.oidc]
issuer = "https://example.okta.com/oauth2/default"
client_id = "0oaexampleferrosmart"

# The integration's client authentication is "Public key / Private key"
# (Okta OpenID Connect & OAuth 2.0 API, Client authentication, JWT with
# private key), the `private_key_jwt` FerroSMART takes when no table names
# another: its public keys hold the JWK FerroSMART publishes at
# {issuer}/upstream-jwks, and FerroSMART signs each client assertion with
# the current key of its own assertion ring, never a token key
# (RFC 8725 §3.12). A rotation adds the next key's JWK to the integration
# before the ring makes it current.
[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream-assertion.pem"

# The policy as content (docs/architecture.md §13.6 item 5): a member of the
# Okta group `clinician` may be granted these user/ scopes.
[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs", "user/Observation.rs"]

# The example's SMART app is the client document example-app.json beside
# this file, which `ferrosmart client apply example-app.json` registers.
