# FerroSMART with Keycloak as its upstream OpenID Connect provider, for login
# only (#522, docs/architecture.md §13.2): Keycloak authenticates the person,
# FerroSMART issues the SMART tokens. Every name here matches
# ferrosmart-realm.json beside this file. The token signing key and the
# upstream assertion key are files the operator creates
# (scripts/idp/keycloak-launch.sh makes them for its run).

[ferrosmart]
# The issuer a browser and the provider's redirect reach FerroSMART by:
# plain http on a loopback host (RFC 8414 §3, as ferrohealth-smart reads it).
issuer = "http://localhost:8080"
# A workforce login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[[ferrosmart.resource]]
base = "http://localhost:8090/fhir"
kind = "fhir"

# The provider. Its discovery document is
# {issuer}/.well-known/openid-configuration (OpenID Connect Discovery 1.0
# §4), and FerroSMART is its confidential client `ferrosmart`, which
# authenticates with a JWT its assertion ring signs, read by Keycloak from
# FerroSMART's {issuer}/upstream-jwks (OpenID Connect Core 1.0 §9,
# private_key_jwt; the realm's client-jwt authenticator with a JWKS URL).
# The `keycloak` preset (app/ferrosmart/presets/keycloak.toml) brings what
# ferrosmart-realm.json sets up: the scope `openid`, the user attribute
# mapper's `fhir_user` claim, the realm role mapper's `roles` claim and
# RS256, the algorithm the realm's client enforces. `ferrosmart upstream
# registration keycloak` prints what the realm's client needs.
[[ferrosmart.upstream]]
name = "keycloak"
preset = "keycloak"

[ferrosmart.upstream.oidc]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"

# The assertion ring of private_key_jwt, the client authentication taken
# when no table names another, apart from the token keys (RFC 8725 §3.12).
[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream_assertion_key"

# FerroSMART's own SMART Backend Services client (docs/architecture.md
# §13.33): it reads a patient's own record for them during a standalone
# launch with a client credentials token, `system/Patient.rs`, and keeps
# its own registration. Its assertion key is a P-384 key of its own, never
# a token key (RFC 8725 §3.12).
[ferrosmart.backend]
client_id = "ferrosmart"

[ferrosmart.backend.keys]
private_key_file = "/run/secrets/backend-assertion.pem"

# The policy as content (docs/architecture.md §13.6 item 5): a person with the
# realm role `clinician` may be granted these user/ scopes.
[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs", "user/Observation.rs"]

# The example's SMART app is the client document example-app.json beside
# this file, which `ferrosmart client apply example-app.json` registers.
