# FerroSMART with Microsoft Entra ID as its upstream OpenID Connect provider,
# for login only (#524, docs/architecture.md §13.18): Entra ID authenticates
# the person, FerroSMART issues the SMART tokens. The tenant and client ids
# are placeholders for the app registration's values. The contract tests of
# tests/it/upstream_vendors.rs run this file against a stub of Entra ID.

[ferrosmart]
issuer = "https://smart.example.org"
# A workforce login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[[ferrosmart.resource]]
base = "https://ehr.example.org/fhir"
kind = "fhir"

# The provider: the tenant-specific v2.0 authority, whose discovery document
# is {issuer}/.well-known/openid-configuration (OpenID Connect Discovery 1.0
# §4; v2-protocols-oidc.md, Find your app's OpenID configuration document
# URI). FerroSMART is the registration's confidential web client. The
# `entra` preset (app/ferrosmart/presets/entra.toml) brings the scopes
# `openid profile`, the `fhirUser` claim `extn.fhirUser`, the app roles in
# `roles` and the assertion algorithm PS256; a key set below wins over it.
# `ferrosmart upstream registration entra` prints what the app registration
# needs.
[[ferrosmart.upstream]]
name = "entra"
preset = "entra"

[ferrosmart.upstream.oidc]
issuer = "https://login.microsoftonline.com/aaaabbbb-0000-cccc-1111-dddd2222eeee/v2.0"
client_id = "00001111-aaaa-2222-bbbb-3333cccc4444"

# The certificate credential (how-to-add-credentials.md, Add a certificate):
# FerroSMART signs a client assertion with the current key of its own
# assertion ring, never a token key (RFC 8725 §3.12), naming the
# certificate uploaded to the registration by `x5t#S256`
# (certificate-credentials.md, Assertion format; OpenID Connect Core 1.0 §9).
[ferrosmart.upstream.oidc.private_key_jwt]
certificate_file = "/run/secrets/upstream-assertion.crt"

# The assertion ring; a rotation uploads the next key's certificate to the
# registration before the ring makes it current.
[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream-assertion.pem"

# FerroSMART's own SMART Backend Services client (docs/architecture.md
# §13.33): it reads a patient's own record for them during a standalone
# launch with a client credentials token, `system/Patient.rs`, as a client
# registered under its own issuer identifier. Its assertion key is a P-384
# key of its own, never a token key (RFC 8725 §3.12).
[ferrosmart.backend.keys]
private_key_file = "/run/secrets/backend-assertion.pem"

# The policy as content (docs/architecture.md §13.6 item 5): a person holding
# the app role `clinician` may be granted these user/ scopes.
[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs", "user/Observation.rs"]

# The example's SMART app is the client document example-app.json beside
# this file, which `ferrosmart client apply example-app.json` registers.
