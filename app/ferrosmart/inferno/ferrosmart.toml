# FerroSMART as the Inferno lane runs it (#520, docs/architecture.md §13.13).
# scripts/inferno/lane.sh passes the files it makes for each run with
# `--set`: the server certificate and key, the signing key, the upstream
# assertion key, the JWK Sets of the two key-holding clients, the secret
# hash of the symmetric one and the database URL. Nothing here is a secret.

[server]
listen = "127.0.0.1:8443"

[ferrosmart]
# The host name resolves to the loopback address (RFC 6761 §6.3); the lane's
# development CA signs its certificate, and every party trusts that CA.
issuer = "https://smart.localhost:8443"
# A test lane's login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[ferrosmart.database]
max_connections = 4

# The one resource server: FerroBRIDGE's FHIR R4 facade, with FerroEHR as its
# CDR. Its SMART document describes this issuer.
[[ferrosmart.resource]]
base = "https://bridge.localhost:9443/fhir"
kind = "fhir"

# The person logs in at Keycloak with the realm of
# app/ferrosmart/examples/keycloak (docs/architecture.md §13.16).
[[ferrosmart.upstream]]
name = "keycloak"
preset = "keycloak"

[ferrosmart.upstream.oidc]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"

# The realm's client authenticates FerroSMART by a JWT its assertion key
# signs (OpenID Connect Core 1.0 §9), read from {issuer}/upstream-jwks: the
# default private_key_jwt, whose key file the lane names.

[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Practitioner.rs", "patient/Patient.rs"]

# Inferno as a Backend Services client. Its public keys are registered by
# value, taken from the test kit's own key set at the pinned commit; SMART
# App Launch 2.2.0, Client Authentication: Asymmetric, Registering a client.
[[ferrosmart.client]]
client_id = "inferno-backend-services"
name = "Inferno SMART App Launch test kit"
kind = "confidential_asymmetric"
scopes = ["system/Practitioner.rs"]
resources = ["https://bridge.localhost:9443/fhir"]
grant_types = ["client_credentials"]

# Inferno as an app, launched standalone and from the lane's EHR: a public
# client with PKCE (SMART App Launch 2.2.0, Client Types, client-public),
# redirected to the kit's own route, that may refresh offline.
[[ferrosmart.client]]
client_id = "inferno-standalone"
name = "Inferno SMART App Launch test kit"
kind = "public"
redirect_uris = ["http://localhost:4567/custom/smart_stu2_2/redirect"]
scopes = ["openid", "fhirUser", "launch", "launch/patient", "offline_access", "user/Practitioner.rs", "patient/Patient.rs"]
resources = ["https://bridge.localhost:9443/fhir"]
grant_types = ["authorization_code", "refresh_token"]

# Inferno as the app the lane's EHR launches: a confidential symmetric
# client (SMART App Launch 2.2.0, Client Authentication: Symmetric) whose
# secret smart_stu2_2.yaml gives the kit; the lane names the file holding its
# Argon2id hash, made for the run by `ferrosmart client hash-secret`.
[[ferrosmart.client]]
client_id = "inferno-ehr"
name = "Inferno SMART App Launch test kit"
kind = "confidential_symmetric"
redirect_uris = ["http://localhost:4567/custom/smart_stu2_2/redirect"]
scopes = ["openid", "fhirUser", "launch", "offline_access", "user/Practitioner.rs"]
resources = ["https://bridge.localhost:9443/fhir"]
grant_types = ["authorization_code", "refresh_token"]

# The lane itself: the EHR that registers each EHR launch (docs/architecture.md
# §13.6 item 3, the `system/launch.c` scope), and the holder of the bearer
# token the kit introspects with, for FerroSMART's own issuer as its
# audience (item 8, the `system/introspect` scope).
[[ferrosmart.client]]
client_id = "inferno-lane"
name = "The Inferno lane"
kind = "confidential_asymmetric"
scopes = ["system/introspect", "system/launch.c"]
grant_types = ["client_credentials"]
