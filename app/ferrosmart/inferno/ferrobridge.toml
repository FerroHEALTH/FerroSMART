# FerroBRIDGE as the Inferno lane's FHIR R4 server (#520): its facade serves
# the Practitioner the person's fhirUser names, from FerroEHR's demographic
# store, and checks FerroSMART's tokens as a SMART resource server.
# scripts/inferno/lane.sh passes the certificate, the trust root and the
# mapping directory through the FERROBRIDGE__ environment.

[server]
listen = "127.0.0.1:9443"

[cdr]
endpoint.url = "http://127.0.0.1:9080/ferroehr/rest/openehr/v1"
demographic = true

[facade]
enabled = true
base_url = "https://bridge.localhost:9443/fhir"
composition_language = "en"
composition_territory = "NL"

# The picker searches Patient by name (FerroBRIDGE's `[facade.party_search]`,
# over the CDR's AQL demographic extension), on the name the party mapping
# writes.
[facade.party_search]
enabled = true

[facade.party_search.types.Patient]
name_query = "SELECT p/uid/value FROM PERSON p WHERE p/identities/details/items[at0005]/value/value LIKE $name OR p/identities/details/items[at0005]/value/value LIKE $name_lower OR p/identities/details/items[at0005]/value/value LIKE $name_capitalised ORDER BY p/uid/value ASC"

[operations]
enabled = false

[usage_report]
enabled = false

# FerroSMART is an OpenID Connect provider too, so the document lists
# `sso-openid-connect` and writes the issuer (SMART App Launch 2.2.0,
# Conformance, Metadata).
[auth]
capabilities = ["sso-openid-connect"]

# FerroSMART issues the tokens the facade takes, read as one issuer table
# under the `ferrosmart` preset of ferrohealth-smart, as FerroBRIDGE's
# "Running behind FerroSMART" page deploys it: the preset makes it a
# `persons` issuer whose audience is the facade's base, admits FerroSMART's
# own picker as the person (docs/architecture.md §13.6 item 4), and a
# machine's token by client credentials.
[auth.issuer.ferrosmart]
issuer = "https://smart.localhost:8443"
preset = "ferrosmart"

# The kit's two apps, public and symmetric.
[auth.issuer.ferrosmart.profile]
delegates = [
  { client = "inferno-standalone" },
  { client = "inferno-ehr" },
]
