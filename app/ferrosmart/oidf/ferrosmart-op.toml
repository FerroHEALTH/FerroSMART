# FerroSMART as the OpenID Provider the OpenID Foundation conformance suite
# tests (#621, scripts/oidf/lane.sh), with Keycloak as its upstream login.
# The suite is the static client `oidf-suite`, a confidential symmetric
# client, since the Basic OP profile fixes `client_secret_basic`. The lane
# gives the key files, the secret hashes and the database with `--set`. No
# specification governs the lane: our own design.

[server]
listen = "127.0.0.1:9443"

[ferrosmart]
issuer = "https://localhost.emobix.co.uk:9443"
# A test lane's login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[ferrosmart.database]
max_connections = 4

# The suite names no resource server; this base is here because FerroSMART
# serves at least one.
[[ferrosmart.resource]]
base = "https://localhost.emobix.co.uk:9443/fhir"
kind = "fhir"

[[ferrosmart.upstream]]
name = "keycloak"
preset = "keycloak"

[ferrosmart.upstream.oidc]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"

[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream_assertion_key"

[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs"]

# The suite's two clients, at the redirect URI of the alias `ferrosmart-op`,
# are the documents under op-clients/, which the lane applies with
# `ferrosmart client apply` once it has added each one's secret hash.
