# FerroSMART as the relying party of the OpenID Foundation conformance suite
# (#621, scripts/oidf/lane.sh): its upstream provider is the suite, at the
# issuer the suite gives the alias `ferrosmart`. scripts/oidf/rp-client.sh
# starts it once for each test module, since a module is a provider with keys
# of its own behind one issuer. The lane gives the key files, the trust roots
# and the database with `--set`. No specification governs the lane: our own
# design.

[server]
listen = "127.0.0.1:9443"

[ferrosmart]
issuer = "https://localhost.emobix.co.uk:9443"
# A test lane's login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"

[ferrosmart.database]
max_connections = 4

# The server the lane's app asks a token for; nothing reads it.
[[ferrosmart.resource]]
base = "https://localhost.emobix.co.uk:9443/fhir"
kind = "fhir"

[[ferrosmart.upstream]]
name = "suite"

[ferrosmart.upstream.oidc]
issuer = "https://localhost.emobix.co.uk:8443/test/a/ferrosmart/"
client_id = "ferrosmart"
# The scopes of OpenID Connect Core 1.0 §5.4, which one module of the suite
# refuses an authorization request without.
scopes = ["openid", "profile", "email", "address", "phone"]

# No client authentication here: scripts/oidf/rp-client.sh adds the one
# each module fixes, `private_key_jwt` with the key app/ferrosmart/oidf/rp.json
# registers under the `kid` oidf-lane, or `client_secret_basic` with the
# secret it registers (OpenID Connect Core 1.0 §9).

# The app whose authorization request begins each login is the document
# under rp-clients/, which the lane applies with `ferrosmart client apply`.
