# FerroSMART in the third-party lane (#598, scripts/idp/third-party-fhir.sh):
# the authorization server of a FHIR server that is no FerroHEALTH product,
# behind a token validator that knows nothing of FerroHEALTH. The lane gives
# the key files and the database with `--set`. No specification governs the
# lane: our own design.

[ferrosmart]
issuer = "http://localhost:8080"
# A test lane's login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"
# Short, so the lane can show the validator refusing a token past its `exp`
# (RFC 9068 §4) without waiting minutes.
access_token_lifetime = "10s"

# The validator's listener, which is the base the FHIR server's clients name
# and so the `aud` of its tokens (RFC 9068 §3).
[[ferrosmart.resource]]
base = "http://localhost:8090/fhir"
kind = "fhir"

# The APISIX gateway's listener in front of the same FHIR server (#639),
# which introspects every token it is shown.
[[ferrosmart.resource]]
base = "http://localhost:8092/fhir"
kind = "fhir"

# Another server, whose tokens the validator refuses.
[[ferrosmart.resource]]
base = "http://localhost:8099/fhir"
kind = "fhir"

[[ferrosmart.upstream]]
name = "keycloak"
preset = "keycloak"

[ferrosmart.upstream.oidc]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"

[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream_assertion_key"

[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs"]

# The lane's clients are the documents under clients/, which it applies
# with `ferrosmart client apply` once it has added the keys and the secret
# hash: the app of the person's standalone launch; the Backend Services
# client, which also reads what an introspecting resource server would
# (docs/architecture.md §13.6 item 8); and the APISIX gateway, a resource
# server that introspects by HTTP Basic, a confidential symmetric client
# with the authorization code grant and a redirect URI, since SMART App
# Launch 2.2.0 gives that profile no client credentials grant.
