# FerroSMART in the third-party lane (#598, scripts/idp/third-party-fhir.sh):
# the authorization server of a FHIR server that is no FerroHEALTH product,
# behind a token validator that knows nothing of FerroHEALTH. The lane gives
# the key files and the database with `--set`. No specification governs the
# lane: our own design.

[ferrosmart]
issuer = "http://localhost:8080"
# A test lane's login with no eIDAS level of assurance; an EU deployment keeps the
# substantial floor and maps its provider's values under
# [ferrosmart.upstream.assurance] (docs/architecture.md §13.28).
assurance_minimum = "none"
# Short, so the lane can show the validator refusing a token past its `exp`
# (RFC 9068 §4) without waiting minutes.
access_token_lifetime = "10s"

# The validator's listener, which is the base the FHIR server's clients name
# and so the `aud` of its tokens (RFC 9068 §3).
[[ferrosmart.resource]]
base = "http://localhost:8090/fhir"
kind = "fhir"

# The APISIX gateway's listener in front of the same FHIR server (#639),
# which introspects every token it is shown.
[[ferrosmart.resource]]
base = "http://localhost:8092/fhir"
kind = "fhir"

# Another server, whose tokens the validator refuses.
[[ferrosmart.resource]]
base = "http://localhost:8099/fhir"
kind = "fhir"

[[ferrosmart.upstream]]
name = "keycloak"
preset = "keycloak"

[ferrosmart.upstream.oidc]
issuer = "http://localhost:8180/realms/ferrosmart"
client_id = "ferrosmart"

[ferrosmart.upstream.oidc.private_key_jwt.keys]
private_key_file = "/run/secrets/upstream_assertion_key"

[[ferrosmart.role]]
name = "clinician"
scopes = ["user/Patient.rs"]

# The app of the person's standalone launch.
[[ferrosmart.client]]
client_id = "example-app"
name = "Example SMART app"
kind = "public"
resources = ["http://localhost:8090/fhir", "http://localhost:8092/fhir", "http://localhost:8099/fhir"]
redirect_uris = ["http://localhost:9000/callback"]
scopes = ["openid", "fhirUser", "user/Patient.rs"]
grant_types = ["authorization_code"]

# The Backend Services client, which also reads what an introspecting
# resource server would (docs/architecture.md §13.6 item 8).
[[ferrosmart.client]]
client_id = "third-party-lane"
name = "The third-party lane"
kind = "confidential_asymmetric"
resources = ["http://localhost:8090/fhir", "http://localhost:8092/fhir", "http://localhost:8099/fhir"]
scopes = ["system/Patient.rs", "system/introspect"]
grant_types = ["client_credentials"]

# The APISIX gateway, a resource server that introspects (#639): a
# confidential symmetric client whose ceiling lists `system/introspect` and
# which authenticates to the introspection endpoint by HTTP Basic
# (docs/architecture.md §13.6 item 8). A symmetric client registers the
# authorization code grant with a redirect URI, since SMART App Launch 2.2.0
# keeps the profile from Backend Services; the gateway's plugin is an OpenID
# Connect relying party, and the lane uses neither.
[[ferrosmart.client]]
client_id = "third-party-gateway"
name = "The third-party lane's gateway"
kind = "confidential_symmetric"
resources = ["http://localhost:8090/fhir", "http://localhost:8092/fhir", "http://localhost:8099/fhir"]
redirect_uris = ["http://localhost:8092/callback"]
scopes = ["system/introspect"]
grant_types = ["authorization_code"]
secret_hash_file = "/run/secrets/gateway_secret_hash"
