# CI in five jobs and the conclusion (no specification governs this: our own
# design).
#
#   1. `guards` runs the workflow, shell and repository guards, the
#      duplication ratchet among them, and the publish dry run, all without
#      a build cache.
#   2. `lint` runs rustfmt, clippy over every feature set, rustdoc over
#      every feature set and cargo-deny over one build cache.
#   3. `nextest (core and axum)` runs the tests, the doctests and, where a
#      change reaches the profiles or the resource server, the live Keycloak
#      case, and where it reaches FerroSMART, the standalone launch through
#      Keycloak and the Inferno SMART App Launch lane.
#   4. `cargo-semver-checks` runs on a pull request only.
#   5. `quickstart` builds the FerroSMART image from a static binary and runs
#      a standalone launch through `compose.yaml` with `compose.keycloak.yaml`,
#      where a change reaches the image or the quickstart.
#
# Every job starts at once and pays one runner queue wait: the hosted runner
# pool is shared across the organisation, so each job pays the wait for a
# runner however short its work, and a job that waits on another pays it
# twice. That wait, not the work, made a run take 48 to 58 minutes, so the
# guards share one job, and each step there runs when an earlier one failed,
# so a run still reports every finding.
#
# The vendored-specification guard runs in specs.yml beside this workflow.
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#77).
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Guards, no build cache ------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read # the no-changelog label, read when the guard runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The crate version guard compares the pull request's base and head.
          fetch-depth: 0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.31.1,shellcheck@0.11.0
      - name: zizmor audits .github
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/
      - name: actionlint lints .github/workflows
        if: ${{ !cancelled() }}
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: The release plan orders tags by version and counts the support period
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: The VEX coverage check of the FerroSMART release refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-coverage.sh --self-test
      - name: The product image freshness readers hold over fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pin-freshness.sh --self-test
      - name: The FerroSMART Dockerfile is clean at hadolint
        if: ${{ !cancelled() }}
        # The official image, digest-pinned like actionlint's: hadolint has no
        # checksum-verified installer in the pinned tool set.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold warning docker/ferrosmart/Dockerfile
      - name: The FerroSMART quickstart is a valid compose file
        if: ${{ !cancelled() }}
        run: docker compose -f compose.yaml config --quiet
      - name: The Keycloak overlay of the quickstart is a valid compose file
        if: ${{ !cancelled() }}
        run: docker compose -f compose.yaml -f compose.keycloak.yaml config --quiet
      - name: The ZITADEL overlay of the quickstart is a valid compose file
        if: ${{ !cancelled() }}
        run: docker compose -f compose.yaml -f compose.zitadel.yaml config --quiet
      - name: The changelog Security check passes and refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --self-test
      - name: The caller kind guard refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/caller-kinds.sh --self-test
      - name: The architecture and the README list every caller kind
        if: ${{ !cancelled() }}
        run: bash scripts/checks/caller-kinds.sh
      - name: The OpenID Foundation pass list names an issue for every failure
        if: ${{ !cancelled() }}
        run: bash scripts/oidf/lane.sh check
      - name: The crate-version guard refuses a dated section that has no tag
        if: ${{ !cancelled() }}
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The attribution hook reads only the commit and pull request text
        if: ${{ !cancelled() }}
        run: bash .claude/hooks/no_attribution_guard.sh --self-test
      - name: The manual crate publish refuses a run off its release tag
        if: ${{ !cancelled() }}
        run: bash scripts/release/publish-crates.sh --self-test
      # Every section of each crate's changelog (crates/<crate>/CHANGELOG.md)
      # holds Keep a Changelog types each once, and [Unreleased] keeps the
      # Security rules the release plan checks on the section it cuts.
      - name: The structure guard refuses what it claims to and reads every crate
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-structure.sh --self-test
      - name: Every crate's changelog keeps the structure
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-structure.sh
      # The changelog fragments (changelog.d/README.md): every fragment well
      # formed, and each changelog with its fragments folded into
      # [Unreleased] keeps the structure and the Security rules of Regulation
      # (EU) 2024/2847 Annex I Part II(2), (4) and (8): every Security entry
      # names its GHSA advisory or VEX statement, and a Security section
      # beside other changes opens with its reason.
      - name: The fragment tool assembles, previews and refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --self-test
      - name: Every changelog fragment is well formed
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --check
      - name: Every changelog with its fragments folded in keeps the structure and the Security rules
        if: ${{ !cancelled() }}
        run: bash scripts/release/changelog.sh --check-preview
      # The release window: while a package's newest dated section is
      # assembled and untagged, changelog.d/<package>/ holds no fragment, so
      # the commit to be tagged carries none.
      - name: The release window guard refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/release-window.sh --self-test
      - name: No fragment sits in an open release window
        if: ${{ !cancelled() }}
        run: bash scripts/checks/release-window.sh
      # A pull request that changes a user-visible surface adds a fragment,
      # and none writes under [Unreleased] or a pending section. The
      # `no-changelog` label waives the fragment, never the refusal; it is
      # read when the step runs, so after setting it re-run the job.
      - name: The changelog guard refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-guard.sh --self-test
      - name: A user-visible change adds a changelog fragment and edits no [Unreleased]
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')" = true ]; then
            echo "no-changelog label set: the fragment is waived, an [Unreleased] edit is still refused."
            bash scripts/checks/changelog-guard.sh --waived "$BASE" "$HEAD"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"
      # No tracked file keeps an unresolved merge conflict (#191).
      - name: The conflict-marker guard refuses each marker and skips the vendored corpora
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh --self-test
      - name: No tracked file keeps a conflict marker
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh
      - name: Comment style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all
      # The duplication ratchet (#265): the duplicated lines of the
      # hand-written Rust may fall and never rise. jscpd runs from its pinned
      # image; a fall passes with a note, and ratchet-tighten.yml records it.
      - name: Duplication ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh --self-test
      - name: The duplicated lines have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh
      - name: Every pending-work pointer names an open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh
      - name: The version, the lock and the changelog agree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      - name: Dependency review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      # No cache: the dry run checks the bytes a publish would upload.
      - uses: ./.github/actions/setup-rust
        if: ${{ !cancelled() }}
        with:
          cache: "false"
      # NOTE: Cargo packages the workspace members together, so ferrohealth-authz
      # verifies against the ferrohealth-smart it ships beside before that is on crates.io.
      - name: Publish dry run
        if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --locked

      # The site link guard: the book's sources linted, and the site assembled
      # as the Docs workflow publishes it, the landing page at the root and the
      # book under /docs/, with every internal link and anchor resolved
      # offline, and README.md against the tree. It sits here, inside the
      # required conclusion, because the Docs workflow's build is no required
      # check. Its self-test proves a broken anchor and a missing page fail.
      - name: Install the docs toolchain
        if: ${{ !cancelled() }}
        uses: ./.github/actions/docs-toolchain
      - name: Every link and anchor of the site resolves
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/checks/site-links.sh --self-test
          bash scripts/checks/site-links.sh

  # ---- Rust ------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # The core compiles without a framework, and the layer and the
      # extractor behind the `axum` feature, so both are linted; so is the
      # build without the `fetch` feature, which links no HTTP client, and
      # the `axum` build without `openehr` the FHIR products link. The
      # SMART on openEHR grammar (`openehr-scopes`) is linted on the host
      # and for the browser target, where it is the whole crate.
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy with every feature
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy with axum and openehr alone
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --no-default-features --features axum,openehr --locked -- -D warnings
      - name: clippy with axum
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --features axum --locked -- -D warnings
      - name: clippy with idp-entra
        if: ${{ !cancelled() }}
        run: cargo clippy -p ferrohealth-smart --all-targets --features idp-entra --locked -- -D warnings
      - name: clippy with openehr-scopes alone
        if: ${{ !cancelled() }}
        run: cargo clippy -p ferrohealth-smart --all-targets --no-default-features --features openehr-scopes --locked -- -D warnings
      - name: clippy with openehr-scopes for wasm32
        if: ${{ !cancelled() }}
        run: cargo clippy -p ferrohealth-smart --no-default-features --features openehr-scopes --target wasm32-unknown-unknown --locked -- -D warnings
      - name: rustdoc with every feature
        if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
      # docs.rs builds all features, a product's `cargo doc` the features it
      # takes: each set documents without a broken link (#135).
      - name: rustdoc with the default features
        if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --no-deps --document-private-items
      - name: rustdoc with no feature
        if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --no-default-features --no-deps --document-private-items
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        if: ${{ !cancelled() }}
        run: bash scripts/checks/advisory-exceptions.sh

  # The live Keycloak case runs here after the suites (#239): the `keycloak`
  # profile against the Keycloak image docs/VERSIONS.md pins, which
  # tests/it/keycloak_live.rs starts, obtains tokens from and classifies. It
  # runs on a pull request that touches the profiles, the resource server, the
  # case itself or the pins, on a manual run, and on every push to main, which
  # saves the build cache a pull request run restores (#243).
  test:
    name: nextest (core and axum)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      # The Inferno lane lists each pending group with the state of its issues.
      issues: read
    # FerroSMART's store cases create a schema each on this server
    # (app/ferrosmart/tests/it/store.rs), the image docs/VERSIONS.md pins.
    services:
      postgres:
        image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
        env:
          POSTGRES_USER: ferrosmart
          POSTGRES_PASSWORD: ferrosmart
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrosmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FERROSMART_TEST_PG_URL: postgres://ferrosmart:ferrosmart@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # The Brands Bundle case reads the FHIR packages the SMART package
      # depends on, fetched at build time and never committed (#602).
      - name: Read the pinned FHIR packages
        id: fhir-packages
        run: echo "key=$(bash scripts/vendor/fhir-packages.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specs/fhir-packages/*/package.tgz
          key: ${{ steps.fhir-packages.outputs.key }}
      - name: Fetch and verify the FHIR packages
        run: bash scripts/vendor/fhir-packages.sh
      - run: cargo nextest run --workspace --locked
      # The vendor adapter suite runs after the generic one, with only its feature.
      - run: cargo nextest run -p ferrohealth-smart --features idp-entra --locked --no-tests=fail -E 'test(/^party::entra::/)'
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo nextest run --workspace --no-default-features --features axum,openehr --locked
      - run: cargo test --doc --workspace --all-features --locked
      - id: paths
        name: Does the change reach the profiles or the resource server
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=false
          while IFS= read -r path; do
            case "$path" in
              crates/ferrohealth-smart/profiles/* | \
                crates/ferrohealth-smart/src/profile.rs | \
                crates/ferrohealth-smart/src/kind.rs | \
                crates/ferrohealth-smart/src/resource/* | \
                crates/ferrohealth-smart/src/sender/* | \
                crates/ferrohealth-smart/tests/it/keycloak_live.rs | \
                .github/workflows/ci.yml | docs/VERSIONS.md | Cargo.lock)
                echo "reaches the live case: $path"
                live=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "live=$live" >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.live == 'true'
        name: The live Keycloak case
        env:
          FERROHEALTH_KEYCLOAK_E2E: "1"
        run: cargo nextest run -p ferrohealth-smart --locked --no-tests=fail -E 'test(/^keycloak_live::/)'
      # FerroSMART with Keycloak upstream (#522): a SMART standalone launch
      # through the example's realm to a token with the mapped fhirUser
      # (scripts/idp/keycloak-launch.sh).
      - id: upstream
        name: Does the change reach FerroSMART's upstream login
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r path; do
            case "$path" in
              app/ferrosmart/* | scripts/idp/* | crates/ferrohealth-smart/src/* | tools/zitadel-fhir-user/* | \
                .github/workflows/ci.yml | docs/VERSIONS.md | Cargo.lock)
                echo "reaches the upstream login: $path"
                run=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.upstream.outputs.run == 'true'
        name: A standalone launch through Keycloak
        env:
          LANE_DIR: ${{ runner.temp }}/keycloak-launch
          LANE_PG: postgres://ferrosmart:ferrosmart@localhost:5432
        run: |
          cargo build -p ferrosmart --locked
          scripts/idp/keycloak-launch.sh
      - if: failure() && steps.upstream.outputs.run == 'true'
        name: Keep the Keycloak launch's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keycloak-launch
          path: ${{ runner.temp }}/keycloak-launch/*.log
          if-no-files-found: ignore
      # FerroSMART with ZITADEL upstream (#523): the example's bootstrap and
      # Actions v2 target, and a SMART standalone launch through them to a
      # token with the mapped fhirUser and a role-granted scope
      # (scripts/idp/zitadel-launch.sh).
      - if: steps.upstream.outputs.run == 'true'
        name: A standalone launch through ZITADEL
        env:
          LANE_DIR: ${{ runner.temp }}/zitadel-launch
          LANE_PG: postgres://ferrosmart:ferrosmart@localhost:5432
        run: |
          cargo build -p ferrosmart -p zitadel-fhir-user --locked
          scripts/idp/zitadel-launch.sh
      - if: failure() && steps.upstream.outputs.run == 'true'
        name: Keep the ZITADEL launch's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zitadel-launch
          path: ${{ runner.temp }}/zitadel-launch/*.log
          if-no-files-found: ignore
      # FerroSMART's tokens at a third-party FHIR server behind a standard
      # token validator (#598): HAPI FHIR behind Envoy's JWT authentication
      # filter, with a Backend Services token and a person's token from a
      # standalone launch through Keycloak, and behind APISIX, which
      # introspects by HTTP Basic, a revoked token refused (#639)
      # (scripts/idp/third-party-fhir.sh).
      - if: steps.upstream.outputs.run == 'true'
        name: A third-party FHIR server behind a standard token validator
        env:
          LANE_DIR: ${{ runner.temp }}/third-party-fhir
          LANE_PG: postgres://ferrosmart:ferrosmart@localhost:5432
        run: |
          cargo build -p ferrosmart --locked
          scripts/idp/third-party-fhir.sh
      - if: failure() && steps.upstream.outputs.run == 'true'
        name: Keep the third-party lane's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-fhir
          path: ${{ runner.temp }}/third-party-fhir/*.log
          if-no-files-found: ignore
      # The OpenID Foundation conformance suite lane (#621): the suite's
      # published image tests FerroSMART as a relying party and as an OpenID
      # Provider, and app/ferrosmart/oidf/expected.tsv holds every module to
      # its result (scripts/oidf/lane.sh). It runs before the Inferno lane,
      # which leaves its parties on ports this one binds.
      - id: oidf
        name: Does the change reach FerroSMART's OpenID Connect
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r path; do
            case "$path" in
              app/ferrosmart/* | scripts/oidf/* | crates/ferrohealth-smart/src/* | \
                docs/specs/oidf-conformance-suite/* | .github/workflows/ci.yml | docs/VERSIONS.md | Cargo.lock)
                echo "reaches the OpenID Foundation lane: $path"
                run=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.oidf.outputs.run == 'true'
        name: The OpenID Foundation conformance suite lane
        env:
          LANE_DIR: ${{ runner.temp }}/oidf-lane
          LANE_PG: postgres://ferrosmart:ferrosmart@localhost:5432
          OIDF_PYTHON: ${{ runner.temp }}/oidf-python/bin/python
        run: |
          cargo build -p ferrosmart --locked
          python3 -m venv "$RUNNER_TEMP/oidf-python"
          "$OIDF_PYTHON" -m pip install --quiet --require-hashes --no-deps -r app/ferrosmart/oidf/requirements.txt
          scripts/oidf/lane.sh run
      - if: (failure() || cancelled()) && steps.oidf.outputs.run == 'true'
        name: Keep the OpenID Foundation lane's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidf-lane
          path: |
            ${{ runner.temp }}/oidf-lane/*.log
            ${{ runner.temp }}/oidf-lane/*.tsv
            ${{ runner.temp }}/oidf-lane/plan-*.json
          if-no-files-found: ignore
      # The Inferno SMART App Launch lane (#520): the kit's STU 2.2 suite
      # against FerroSMART, with FerroEHR as the resource server
      # (scripts/inferno/lane.sh). The kit and its runtime are the pins of
      # docs/VERSIONS.md.
      - id: inferno
        name: Does the change reach FerroSMART
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r path; do
            case "$path" in
              app/ferrosmart/* | scripts/inferno/* | crates/ferrohealth-smart/src/* | \
                .github/workflows/ci.yml | docs/VERSIONS.md | Cargo.lock)
                echo "reaches the Inferno lane: $path"
                run=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.inferno.outputs.run == 'true'
        name: Check out the Inferno SMART App Launch test kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inferno-framework/smart-app-launch-test-kit
          ref: 980e54e4ed632b28267d797013399a8588772174
          path: .inferno-kit
          persist-credentials: false
      - if: steps.inferno.outputs.run == 'true'
        name: The Inferno lane
        env:
          GH_TOKEN: ${{ github.token }}
          INFERNO_KIT: ${{ github.workspace }}/.inferno-kit
          LANE_DIR: ${{ runner.temp }}/inferno-lane
          LANE_PG: postgres://ferrosmart:ferrosmart@localhost:5432
        run: |
          cargo build -p ferrosmart --locked
          scripts/inferno/lane.sh run
      - if: failure() && steps.inferno.outputs.run == 'true'
        name: Keep the Inferno lane's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inferno-lane
          path: |
            ${{ runner.temp }}/inferno-lane/*.log
            ${{ runner.temp }}/inferno-lane/results.json
            app/ferrosmart/inferno/*_actual_results_*.json
            app/ferrosmart/inferno/*_compared_results_*.csv
          if-no-files-found: ignore

  # Every crate's public API against its newest version on crates.io, on a
  # pull request and in the merge queue: a break, or a public dependency
  # moved to another compatibility line, that the manifest version does not
  # answer with a minor bump fails, so a caret requirement on these crates
  # stays safe (scripts/checks/semver.sh).
  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The pull request's or the merge group's commit and its first parent,
      # the base, so the check judges only a change that reaches a crate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: "false"
      - id: pin
        name: Read the cargo-semver-checks pin
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@${{ steps.pin.outputs.version }}
      - run: bash scripts/checks/semver.sh --changed HEAD^1

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: reach
        name: Does the change reach the image or the quickstart
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r path; do
            case "$path" in
              app/ferrosmart/* | crates/ferrohealth-smart/src/* | docker/ferrosmart/* | .dockerignore | \
                compose.yaml | compose.keycloak.yaml | scripts/idp/* | .github/workflows/ci.yml | \
                docs/VERSIONS.md | Cargo.lock)
                echo "reaches the quickstart: $path"
                run=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.reach.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-musl
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # musl needs its C toolchain for the link step and for aws-lc-sys, as in
      # the release build (release-ferrosmart-build.yml).
      - if: steps.reach.outputs.run == 'true'
        name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - if: steps.reach.outputs.run == 'true'
        name: Build the static binary the image copies
        run: cargo build -p ferrosmart --locked --target x86_64-unknown-linux-musl
      # The quickstart end to end (#519): the image built from that binary,
      # compose.yaml with compose.keycloak.yaml on it, and a standalone launch
      # through them (scripts/idp/compose-launch.sh).
      - if: steps.reach.outputs.run == 'true'
        name: A standalone launch through the quickstart
        env:
          LANE_DIR: ${{ runner.temp }}/compose-launch
          FERROSMART_BINARY: target/x86_64-unknown-linux-musl/debug/ferrosmart
        run: scripts/idp/compose-launch.sh
      - if: failure() && steps.reach.outputs.run == 'true'
        name: Keep the quickstart's logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-launch
          path: ${{ runner.temp }}/compose-launch/*.log
          if-no-files-found: ignore

  conclusion:
    name: conclusion
    needs:
      - guards
      - lint
      - test
      - semver
      - quickstart
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
