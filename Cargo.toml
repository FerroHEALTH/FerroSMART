[workspace]
resolver = "3"
members = ["crates/*", "app/*", "tools/*"]

[workspace.package]
version = "0.38.0"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroSMART"
homepage = "https://github.com/FerroHEALTH/FerroSMART"
authors = ["Ruben Talstra"]

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (.claude/rules/reliability.md). The lines are the ones the
# FerroHEALTH products resolve, so the library adds no second copy to any of
# them. Verified against crates.io on 2026-10-19.
[workspace.dependencies]
# The JSON Schema check of FerroSMART's answers against its OpenAPI document.
jsonschema = { version = "0.61.1", default-features = false }
# The CBOR of an mdoc presentation and its COSE structures (RFC 8949, RFC
# 9052), in FerroSMART's EUDI Wallet verifier. Verified against crates.io
# on 2026-11-24.
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
argon2 = { version = "0.6.0", default-features = false, features = ["password-hash", "alloc"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.44"
url = "2.5.8"
http = "1.5.0"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The family mask every secret and masked URL renders through. Verified
# against crates.io on 2026-10-26.
ferrohealth-secret = "0.2.0"
# The family configuration types: Duration, ByteSize, the retired-key
# refusal and the outbound TLS section. Verified against crates.io on
# 2026-11-09.
ferrohealth-config = "0.5.0"
# The TLS reader of every FerroHEALTH product, behind `server-tls`.
ferrohealth-server = { version = "0.14.0", default-features = false, features = ["platform-verifier"] }
# The JSON Schema of the configuration sections, behind `schema`.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
# ferrohealth-authz reads the subject ferrohealth-smart authenticates; the
# path is the workspace member, the version the one it publishes.
ferrohealth-smart = { path = "crates/ferrohealth-smart", version = "0.38.0", default-features = false }
# ferrohealth-authz: the engine seam, the embedded Cedar engine and its
# hot-swapped policy set. Verified against crates.io on 2026-10-25.
async-trait = "0.1.92"
cedar-policy = "4.14.0"
arc-swap = "1.9.3"
# Test-only: the policy directory of the reload cases.
tempfile = "3.27.0"
# The browser FerroSMART's screenshot capture drives over WebDriver, with the
# Chrome DevTools Protocol for the colour scheme and the full-page size, and
# the process group its chromedriver is killed with (#623).
thirtyfour = { version = "0.38.1", default-features = false, features = ["reqwest", "cdp"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
# The R4 profile validator FerroSMART's Brands Bundle test holds the Bundle
# to, over the SMART App Launch 2.2.0 package set (#602), and the FHIR
# document model it reads.
ferrobridge-validator = "0.23.1"
fhir-types = { version = "0.3.0", default-features = false, features = ["r4"] }
# ferrohealth-session: the session cookie, and the session-watch wire
# FerroUI's script reads. Verified against
# crates.io on 2026-11-23.
cookie = { version = "0.18.3", default-features = false }
ferrohealth-ui = { version = "0.6.6", default-features = false }
# The framework integrations, each behind its feature.
tower = { version = "0.5.3", default-features = false }
axum = { version = "0.8.9", default-features = false }
# Every JWS ferrohealth-smart signs and verifies, ML-DSA (FIPS 204) among
# them, its digests, randomness and HMAC: the crypto provider rustls already
# links. Verified against crates.io on 2026-11-25.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
# FerroSMART, the authorization server under app/ferrosmart: the run path,
# the console log and the health routes the family's servers share, and the
# command line. Verified against crates.io on 2026-11-16.
ferrohealth-telemetry = { version = "0.6.0", default-features = false }
ferrohealth-health = { version = "0.1.1", default-features = false }
ehds-logging = { version = "0.23.0", default-features = false }
ihe-atna = { version = "0.23.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# FerroSMART's own words, beside the library's (FerroUI `docs/consoles.md`).
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
# FerroSMART's state in PostgreSQL (docs/architecture.md §13.9): the driver
# and the embedded migrations, on the line FerroEHR resolves. Verified
# against crates.io on 2026-11-16.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "json"] }
# Test-only: the stub authorization server, the body reader of the
# framework tests, and the JSON formatter the audit line is read back through.
wiremock = "0.6.5"
http-body-util = "0.1.5"
# The reader of the configuration cases and of the book's example tables.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json"] }
# ferrohealth-smart's `client::PresentedTls`, the rustls client configuration
# a product built, on the line reqwest already links; and, test-only, the
# mutual-TLS token endpoint of the RFC 8705 cases, a rustls server with a
# certificate authority, a server and a client certificate generated when
# the case runs. Verified against crates.io on 2026-10-20.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26.6", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# ferrohealth-smart's eHDSI assertion check behind `ehdsi-assertion`: the
# XML reader (no DTD, by default) of the HP Identity Assertion and the
# Treatment Relationship Confirmation, and the X.509 reader of the signer
# certificate, on the lines FerroFED and FerroBRIDGE resolve. Verified
# against crates.io on 2026-11-08.
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
x509-parser = { version = "0.18.1", default-features = false }
# FerroSMART's upstream SAML 2.0 login: the raw DEFLATE of the HTTP-Redirect
# binding (saml-bindings-2.0-os §3.4.4.1), pure Rust. Verified against
# crates.io on 2026-11-19.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

# The reliability bar (no specification governs it: our own design), the
# FerroHEALTH family's lint set as FerroBRIDGE, FerroFED and FerroUI carry it.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
await_holding_lock = "deny"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"
