#
# Keycloak as the quickstart's login, an override of compose.yaml in the same
# project (#522). Keycloak authenticates the person and FerroSMART issues the
# SMART tokens. Run it from a checkout, beside compose.yaml:
#
#   docker compose -f compose.yaml -f compose.keycloak.yaml up
#
# SECRETS. Three more files under ./secrets, made the way compose.yaml's are:
#
#   openssl rand -hex 16 | tr -d '\n' > secrets/keycloak_user_password
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out secrets/upstream_assertion_key.pem
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-384 -out secrets/backend_assertion_key.pem
#   chmod 0644 secrets/keycloak_user_password secrets/upstream_assertion_key.pem secrets/backend_assertion_key.pem
#
# The backend assertion key signs the client assertions of FerroSMART's own
# SMART Backend Services client (docs/architecture.md §13.33).
#
# The realm is app/ferrosmart/examples/keycloak/ferrosmart-realm.json, with
# fixed ids; its placeholders take the password, FerroSMART's JWK Set URL
# and the user's `fhirUser` at import (docs/architecture.md §13.16).
# FerroSMART authenticates to Keycloak with a JWT its assertion key signs,
# a key apart from the token signing key, which Keycloak verifies against
# that URL, so no client secret exists.
# Sign in as `clinician` with the password in secrets/keycloak_user_password.
#
# CLIENTS. The example's public SMART app is the client document
# app/ferrosmart/examples/keycloak/example-app.json. Apply it once
# FerroSMART's database is up:
#
#   docker compose -f compose.yaml -f compose.keycloak.yaml run --rm \
#     ferrosmart client apply /etc/ferrosmart-example/example-app.json
#
# NETWORK. FerroSMART shares Keycloak's network namespace, so both reach each
# other on `localhost`, exactly as the browser does through the published
# ports: http://localhost:8080 is FerroSMART and http://localhost:8180 is
# Keycloak, and each issuer is one URL for every party. `ferrohealth-smart`
# accepts a plain `http` issuer on a loopback host only, so this is a local
# example: a deployment serves both over TLS on their own names.
#
# Keycloak runs in development mode (`start-dev`, Keycloak's server guide,
# Running Keycloak in a container), with its data in the container.

name: ferrosmart

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
    container_name: ferrosmart-keycloak
    restart: unless-stopped
    # The realm's placeholders read the environment at import (Keycloak's
    # server guide, Importing and exporting realms), so the secret files are
    # read into it here and never written to the compose file.
    entrypoint:
      - bash
      - -c
      - |
        export FERROSMART_KEYCLOAK_USER_PASSWORD="$$(cat /run/secrets/keycloak_user_password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HTTP_PORT: "8180"
      FERROSMART_KEYCLOAK_REDIRECT_URI: ${FERROSMART_ISSUER:-http://localhost:8080}/callback
      FERROSMART_KEYCLOAK_JWKS_URL: ${FERROSMART_ISSUER:-http://localhost:8080}/upstream-jwks
      FERROSMART_KEYCLOAK_FHIR_USER: ${FERROSMART_KEYCLOAK_FHIR_USER:-http://localhost:8090/fhir/Practitioner/example}
    secrets:
      - keycloak_user_password
    volumes:
      - type: bind
        source: ./app/ferrosmart/examples/keycloak/ferrosmart-realm.json
        target: /opt/keycloak/data/import/ferrosmart-realm.json
        read_only: true
    # FerroSMART's port is published here, since it shares this namespace.
    ports:
      - "${FERROSMART_BIND_HOST:-127.0.0.1}:${FERROSMART_PORT:-8080}:8080"
      - "${FERROSMART_BIND_HOST:-127.0.0.1}:8180:8180"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ferrosmart:
    network_mode: service:keycloak
    ports: !reset []
    depends_on:
      keycloak:
        condition: service_started
    environment:
      # A workforce login with no eIDAS level of assurance (docs/architecture.md §13.28).
      FERROSMART__FERROSMART__ASSURANCE_MINIMUM: none
      # The upstream login and its claims (ferrosmart.toml of the example).
      FERROSMART__FERROSMART__UPSTREAM__0__NAME: keycloak
      # The keycloak preset brings the scope, the two claims and RS256.
      FERROSMART__FERROSMART__UPSTREAM__0__PRESET: keycloak
      FERROSMART__FERROSMART__UPSTREAM__0__OIDC__ISSUER: http://localhost:8180/realms/ferrosmart
      FERROSMART__FERROSMART__UPSTREAM__0__OIDC__CLIENT_ID: ferrosmart
      FERROSMART__FERROSMART__UPSTREAM__0__OIDC__PRIVATE_KEY_JWT__KEYS__PRIVATE_KEY_FILE: /run/secrets/upstream_assertion_key
      # The realm role `clinician` may be granted these user/ scopes.
      FERROSMART__FERROSMART__ROLE__0__NAME: clinician
      FERROSMART__FERROSMART__ROLE__0__SCOPES__0: user/Patient.rs
      FERROSMART__FERROSMART__ROLE__0__SCOPES__1: user/Observation.rs
      # FerroSMART's own Backend Services client (docs/architecture.md §13.33).
      FERROSMART__FERROSMART__BACKEND__KEYS__PRIVATE_KEY_FILE: /run/secrets/backend_assertion_key
    secrets:
      - database_url
      - signing_key
      - upstream_assertion_key
      - backend_assertion_key
    volumes:
      - type: bind
        source: ./app/ferrosmart/examples/keycloak/example-app.json
        target: /etc/ferrosmart-example/example-app.json
        read_only: true

secrets:
  upstream_assertion_key:
    file: ./secrets/upstream_assertion_key.pem
  backend_assertion_key:
    file: ./secrets/backend_assertion_key.pem
  keycloak_user_password:
    file: ./secrets/keycloak_user_password
