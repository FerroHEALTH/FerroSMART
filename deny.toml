# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The only advisory gate: it reads the RustSec database cargo audit does and
# adds yanked, licences, bans and sources.

[advisories]
version = 2
yanked = "deny"
# An exception is dated and names the event that deletes it.
ignore = []

[licenses]
version = 2
# Dev-dependencies are compiled here and in CI, so their licences are read too.
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on and its Apache 2.0
# Change License admits. A licence joins the day a dependency needs it: ISC,
# MIT-0 and the OpenSSL licence came with aws-lc-rs and aws-lc-sys, the
# crypto provider jsonwebtoken and rustls link.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "OpenSSL",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # The Mozilla root store webpki-roots carries for reqwest's rustls engine.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crate is BUSL-1.1 (LICENSE).
exceptions = [
  { allow = ["BUSL-1.1"], crate = "ferrohealth-smart" },
  # The family's own openEHR crate, the SMART on openEHR grammar.
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
