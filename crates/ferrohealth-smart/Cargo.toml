[package]
name = "ferrohealth-smart"
description = "SMART for the openEHR ecosystem, FHIR included: the shared SMART App Launch and OAuth 2.0 resource-server crate of the FerroHEALTH products, with token validation against the authorization server's keys, the SMART on openEHR and SMART on FHIR scopes with the patient compartment, Basic and client-credentials machine authentication, and the audit line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["smart-on-fhir", "openehr", "oauth2", "jwt", "resource-server"]
categories = ["authentication", "web-programming"]
include = ["src/**", "tests/**", "README.md"]

[features]
default = []
# The tower Layer that guards an axum router (the credential check, the
# scope check and the audit line in front of every route), the extractor of
# the caller it admitted, and the default renderer of a refusal.
axum = ["dep:axum", "dep:tower"]
# The SMART on openEHR scope grammar beside the FHIR one, parsed by
# openehr-sdt and enforced here: the `Requirement::OpenEhr` of a product
# route, the grant rules of the draft, and the launch context `ehrId`.
openehr = ["dep:openehr-sdt"]

[dependencies]
argon2.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
http.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "fs"] }
tracing.workspace = true
url.workspace = true
tower = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
openehr-sdt = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio"] }
wiremock.workspace = true

[lints]
workspace = true
