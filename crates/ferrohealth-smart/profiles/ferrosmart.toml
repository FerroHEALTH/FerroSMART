#
# The `ferrosmart` issuer profile: access tokens of FerroSMART, the family's
# SMART App Launch 2.x authorization server (docs/architecture.md §13). They
# are plain RFC 9068 tokens with no Ferro-specific claim, so every key stays
# at its `rfc9068` default but the three FerroSMART readings. Every key can be set in the issuer's
# `[auth.issuer.<name>.profile]` table, which wins over this file.
#
# The launch context rides beside the RFC 9068 set as `patient`, `encounter`,
# `fhirUser` and, for an openEHR audience, `ehrId` (RFC 9068 §2.2.2,
# docs/architecture.md §13.6 item 2), which the crate reads without a key.
# A person's `sub` is stable across every client (§13.6 item 9), so `iss`
# with `sub` names one person, as the `rfc9068` default has it. A client
# credentials token's `sub` is its `client_id` (RFC 9068 §2.2 and §5), the
# default app-only marker. A resource server trusts FerroSMART in one
# `kind = "persons"` table, which reads those app-only tokens as the system
# too; a second table for the same issuer is refused at load. A token
# whose `aud` names the resource server was issued for it (RFC 9068 §4,
# RFC 8707), so every app FerroSMART registered is admitted. FerroSMART
# grants no token exchange, so a deployment that uses the onward grants
# sets them for another issuer.

# FerroSMART signs its people's tokens, and its client credentials tokens,
# which a `persons` issuer reads as the system (docs/architecture.md §13).
kind = "persons"
# SMART App Launch 2.2.0, Scopes and Launch Context, `launch/patient`: the
# authorization server establishes the patient context, so FerroSMART's
# `patient` claim is the launch context.
patient_context = true
# docs/architecture.md §13.6 item 9: FerroSMART's `sub` is a pairwise
# subject, compared exactly, which a party table binds by default.
party_identifier_type = "pairwise"
# RFC 9068 §2.1: FerroSMART writes `typ` `at+jwt` and never the long form.
token_types = ["at+jwt"]
# RFC 9068 §2.2 and SMART App Launch 2.2.0, Obtain access token, Response:
# FerroSMART writes the granted `scope` into every token.
required_claims = ["iss", "exp", "aud", "sub", "client_id", "iat", "jti", "scope"]
# SMART App Launch 2.2.0 names what a `patient/` scope reaches and not who
# asks (Patient-specific scopes), so who asks is our own design (#681): a
# token through an admitted client whose `fhirUser` is `Patient/<x>` (relative
# or absolute), whose `patient` is `x` and whose scopes are `patient/` alone,
# with no `user/` or `system/` one, is the patient's own (`CallerKind::Patient`).
# A professional's `fhirUser` is never a `Patient`, so a professional with
# `patient/` scopes stays a professional confined to the launch context.
fhir_user_patient = true
