#
# The FerroSMART quickstart, a standalone file: download it, create the
# secret files beside it, and run
#
#   docker compose up
#   curl http://localhost:8080/.well-known/smart-configuration
#
# It pulls the published image (ghcr.io/ferrohealth/ferrosmart, pinned to the
# release this file shipped with) beside PostgreSQL, and needs no repository
# checkout. The release plan refuses a tag whose version differs from the
# default below (scripts/release/plan.sh, check_compose_pin).
#
# SECRETS. Three files under ./secrets are yours to create before the first
# `docker compose up`; compose refuses to start a service whose secret is
# missing. Compose mounts each file as it is on the host, and FerroSMART runs
# as uid 65532, so make the two it reads readable to that user. Never commit
# them.
#
#   mkdir -p secrets
#   openssl rand -hex 24 > secrets/postgres_password
#   printf 'postgresql://ferrosmart:%s@postgres:5432/ferrosmart?sslmode=disable' \
#     "$(cat secrets/postgres_password)" > secrets/database_url
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out secrets/signing_key.pem
#   chmod 0644 secrets/database_url secrets/signing_key.pem
#
# The signing key signs every access token under RS256 and is published,
# public half only, at the `jwks_uri` of the SMART configuration. Rotation
# takes a second key file in the list (FERROSMART__FERROSMART__KEYS__PRIVATE_KEY_FILES,
# comma separated) and hands over every `rotation_period`.
#
# CONFIGURATION. The environment below sets what the quickstart needs, and
# every key of the configuration tree is reachable the same way, as
# FERROSMART__<SECTION>__<KEY>, with an index naming an element of an array
# of tables. Set these in your shell or in a .env file beside this one:
#
#   FERROSMART_ISSUER     the URL clients and resource servers reach
#                         FerroSMART by: https, or http on localhost
#                         (default http://localhost:8080)
#   FERROSMART_RESOURCE   the base URL of the FHIR server the tokens are for,
#                         their `aud` (default http://localhost:8090/fhir)
#
# More resource servers and the rest of the policy go in a configuration
# file in the ./config directory beside this one, which FERROSMART_CONFIG
# names (FERROSMART_CONFIG=/etc/ferrosmart/ferrosmart.toml).
#
# CLIENTS. Clients live in FerroSMART's database. Write each as a JSON client
# document in ./config and apply it; `client apply` creates the client or
# replaces the one with its client_id, and records the change. The first is
# the administrator, a Backend Services client whose `system/admin` scope
# reaches the admin API, with its JWK Set URL:
#
#   mkdir -p config
#   cat > config/admin.json <<'JSON'
#   {
#     "client_id": "admin",
#     "client_name": "Administrator",
#     "token_endpoint_auth_method": "private_key_jwt",
#     "jwks_uri": "https://admin.example.org/jwks.json",
#     "scope": "system/admin",
#     "grant_types": ["client_credentials"]
#   }
#   JSON
#   docker compose run --rm ferrosmart client apply /etc/ferrosmart/admin.json
#
# Every other client goes the same way, or through the admin API.
#
# The environment wins over the file. `docker compose run --rm ferrosmart
# config check` prints the resolved configuration with every secret masked.
#
# PORTS. The published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port
# on 0.0.0.0 is reachable from the network even when the firewall says
# otherwise (https://docs.docker.com/engine/network/packet-filtering-firewalls/).
# To serve another machine, put a reverse proxy that terminates TLS in front
# and set FERROSMART_ISSUER to its https URL.
#
# HEALTH. The image's HEALTHCHECK runs `ferrosmart healthcheck`, which asks the
# server for GET /health/readiness on loopback and exits 0 only on 200, so
# `docker compose ps` shows FerroSMART healthy once it serves and its database
# answers.

# Without this the project is named after the directory the file sits in.
name: ferrosmart

services:
  ferrosmart:
    image: ghcr.io/ferrohealth/ferrosmart:${FERROSMART_VERSION:-0.5.0}
    container_name: ferrosmart
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${FERROSMART_BIND_HOST:-127.0.0.1}:${FERROSMART_PORT:-8080}:8080"
    environment:
      # A key with no value passes the variable through only when your shell
      # or .env sets it, so no file is read until you write one.
      FERROSMART_CONFIG:
      FERROSMART__FERROSMART__ISSUER: ${FERROSMART_ISSUER:-http://localhost:8080}
      FERROSMART__FERROSMART__KEYS__PRIVATE_KEY_FILES: /run/secrets/signing_key
      FERROSMART__FERROSMART__DATABASE__URL_FILE: /run/secrets/database_url
      FERROSMART__FERROSMART__RESOURCE__0__BASE: ${FERROSMART_RESOURCE:-http://localhost:8090/fhir}
      FERROSMART__FERROSMART__RESOURCE__0__KIND: fhir
      # `auto` renders pretty output on a terminal and JSON otherwise.
      FERROSMART__TELEMETRY__FORMAT: ${FERROSMART_LOG_FORMAT:-auto}
      FERROSMART__TELEMETRY__FILTER: ${FERROSMART_LOG_FILTER:-info}
    secrets:
      - database_url
      - signing_key
    # Every piece of state lives in PostgreSQL and every secret is read once
    # at boot, so the root filesystem is read-only and nothing is mounted
    # writable.
    read_only: true
    volumes:
      - type: bind
        source: ${FERROSMART_CONFIG_DIR:-./config}
        target: /etc/ferrosmart
        read_only: true
        bind:
          create_host_path: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The store of every client, token record and assertion id. FerroSMART
  # migrates it at start. The password never reaches the environment: the
  # official image reads POSTGRES_PASSWORD_FILE.
  postgres:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    container_name: ferrosmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferrosmart
      POSTGRES_USER: ferrosmart
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ferrosmart", "-d", "ferrosmart"]
      interval: 5s
      timeout: 5s
      retries: 12
    # The entrypoint starts as root to own the data directory, then drops to
    # the postgres user, so it keeps the capabilities that hand-over needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # No published port: only FerroSMART reaches the database.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  signing_key:
    file: ./secrets/signing_key.pem

volumes:
  postgres-data:
